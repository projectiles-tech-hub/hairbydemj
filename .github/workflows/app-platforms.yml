name: App platform files (one-off)

# Temporary: makes the standard android/ and ios/ folders with Flutter so they
# can be committed. Removed once they are in the repository.
on:
  push:
    branches: [feature/app]
    paths: ['mobile/**', '.github/workflows/app-platforms.yml']

permissions:
  contents: read

jobs:
  platforms:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: |
          mkdir -p /tmp/fresh && cd /tmp/fresh
          flutter create --platforms=android,ios --org com.hairbydemj --project-name hairbydemj hairbydemj
      - uses: actions/upload-artifact@v4
        with:
          name: platforms
          path: |
            /tmp/fresh/hairbydemj/android
            /tmp/fresh/hairbydemj/ios
          include-hidden-files: true
          retention-days: 3
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos || true
