name: App platform files (one-off)

# Temporary: makes the standard android/ and ios/ folders with Flutter so they
# can be committed. Removed once they are in the repository.
on:
  push:
    branches: [feature/app]
    paths: ['mobile/**', '.github/workflows/app-platforms.yml']

permissions:
  contents: read

jobs:
  platforms:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          mkdir -p /tmp/fresh && cd /tmp/fresh
          flutter create --platforms=android,ios --org com.hairbydemj --project-name hairbydemj hairbydemj
          cd hairbydemj && echo "=====TAR START=====" && tar czf - android ios | base64 -w 120 && echo "=====TAR END====="
      - run: |
          cp pubspec.yaml /tmp/pubspec.before
          flutter pub add material_ui || true
          diff /tmp/pubspec.before pubspec.yaml || true
      - run: flutter pub get
      - run: echo "=====LOCK START=====" && cat pubspec.lock && echo "=====LOCK END====="
      - run: flutter analyze --no-fatal-infos || true
      - run: flutter test || true
