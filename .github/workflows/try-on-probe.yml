name: Try-on model check (one-off)

# Temporary: downloads MediaPipe's face model to print its checksum, and tries
# it on a face photo in a real browser. Removed once the checksum is recorded.
on:
  push:
    branches: [feature/try-on]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node scripts/copy-vendor.mjs
      - run: |
          curl -fsSL -o public/vendor/mediapipe/face_landmarker.task https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task
          sha256sum public/vendor/mediapipe/face_landmarker.task
          stat -c %s public/vendor/mediapipe/face_landmarker.task
      - run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node scripts/try-on-probe.mjs
