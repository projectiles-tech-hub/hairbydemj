include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
  errors:
    # Missing awaits on fire-and-forget calls are deliberate (marked unawaited).
    unawaited_futures: ignore

linter:
  rules:
    prefer_single_quotes: true
    always_declare_return_types: true
    avoid_print: true
