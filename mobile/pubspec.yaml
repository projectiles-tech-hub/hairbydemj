name: hairbydemj
description: The hairbydemj shop app for iPhone and Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

# Kept short on purpose: every package here is free and open source.
dependencies:
  flutter:
    sdk: flutter
  # Flutter's Material widgets, now a package of their own (Flutter 3.47 and later).
  material_ui: ^1.11.0
  # Talking to api.hairbydemj.com.
  http: ^1.2.2
  # The sign-in token and bag token, kept in the phone's secure storage.
  flutter_secure_storage: ^9.2.2
  # Opening payment pages, tracking links, WhatsApp and the website.
  url_launcher: ^6.3.1
  # Push notifications (Apple and Google). Off until the owner's keys are set.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Signing in with Google and Apple. Off until the client IDs are set.
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond-300.ttf
          weight: 300
        - asset: assets/fonts/CormorantGaramond-500.ttf
          weight: 500
        - asset: assets/fonts/CormorantGaramond-600.ttf
          weight: 600
    - family: Source Sans 3
      fonts:
        - asset: assets/fonts/SourceSans3-400.ttf
          weight: 400
        - asset: assets/fonts/SourceSans3-600.ttf
          weight: 600
